name: copier

on:
  pull_request:
    branches: ['*']
    paths:
      - '.auxiliary/configuration/copiertv/**'
      - 'copier.yaml'
      - 'data/copier/**'
      - 'template/**'
  push:
    branches:
      - master
    paths:
      - '.auxiliary/configuration/copiertv/**'
      - 'copier.yaml'
      - 'data/copier/**'
      - 'template/**'
  workflow_dispatch: {}

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  validate_template:
    needs: [initialize]
    name: Validate Copier template (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ['default', 'maximum']

    steps:

      - name: Prepare Python
        uses: emcd/python-project-common/.github/actions/python-hatch@master
        with:
          python-version: ${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}

      - name: Install External Linters
        run: |
          pipx install emcd-vibe-linter

      - name: Install Copiertv
        run: pip install copiertv

      - name: Validate Variant
        run: copiertv validate ${{ matrix.variant }}
