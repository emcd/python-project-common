name: Reusable Documenter

on:
  workflow_call:
    inputs:
      include-reports:
        description: 'Include code reports with website?'
        default: false
        required: false
        type: boolean
      python-version:
        required: true
        type: string
      emcd-projects-version:
        description: 'Pinned emcd-projects version for website utility.'
        default: '1.60'
        required: false
        type: string
      configuration:
        description: 'Track configuration TOML file for publication.'
        default: ''
        required: false
        type: string
      legacy-inventory:
        description: 'Legacy-link inventory TOML file for validation.'
        default: ''
        required: false
        type: string

# Destination-scoped serialization for the whole pipeline, including
# Pages deployment: concurrent publications queue rather than race or
# deploy backwards. Cancellation of a queued run must not kill the
# active promotion.
concurrency:
  group: publication-${{ github.repository }}
  cancel-in-progress: false

jobs:

  generate:
    runs-on: ubuntu-latest
    steps:

      - name: Prepare Python
        uses: emcd/python-project-common/.github/actions/python-hatch@master
        with:
          python-version: '${{ inputs.python-version }}'

      - name: Restore Coverage Reports
        if: ${{ inputs.include-reports }}
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports--${{ github.run_id }}
          path: .auxiliary/artifacts/coverage-pytest

      - name: Generate Documentation
        id: generate
        run: |
          hatch --env develop run docsgen
        shell: bash

      - name: Install Website Utility
        run: |
          pipx install 'emcd-projects==${{ inputs.emcd-projects-version }}'

      # TODO: Sign commit with GPG key or use Github API.
      #       If Github API, need to upload tarball to LFS endpoint first.
      #       References:
      #         https://github.com/orgs/community/discussions/24623
      #         https://www.mattmoriarity.com/2019-04-25-uploading-media-with-git-lfs
      #         https://github.com/AnesFoufa/githublfs/blob/main/githublfs.py
      - name: Update Website
        id: update-website
        run: |
          set -eu -o pipefail
          git config --global user.name 'Github Actions Robot'
          git config --global user.email '${{ github.actor }}@users.noreply.github.com'
          if [ -n "${{ inputs.configuration }}" ] || [ -n "${{ inputs.legacy-inventory }}" ]; then
            emcdproj website update --help | grep -q -e '--configuration' || {
              echo 'Installed utility lacks track support; set emcd-projects-version to a release with publisher tracks.' >&2
              exit 1
            }
          fi
          version="$(hatch --env develop version 2>/dev/null)"
          config_args=""
          if [ -n "${{ inputs.configuration }}" ]; then
            config_args="${config_args} --configuration ${{ inputs.configuration }}"
          fi
          if [ -n "${{ inputs.legacy-inventory }}" ]; then
            config_args="${config_args} --legacy-inventory ${{ inputs.legacy-inventory }}"
          fi
          # shellcheck disable=SC2086
          emcdproj website update "${version}" --production ${config_args}
          echo "website=$(pwd)/.auxiliary/artifacts/website" >>${GITHUB_OUTPUT}
          cat ${GITHUB_OUTPUT}
        shell: bash

      - name: Upload Pages Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ steps.update-website.outputs.website }}'

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: generate
    permissions:
      id-token: write # to verify deployment originates from appropriate source
      pages: write    # to deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy Pages Artifact
        id: deployment
        uses: actions/deploy-pages@v4
